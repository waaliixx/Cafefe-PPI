<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">
    <ui:define name="titulo_pagina">Descuentos</ui:define>
    <ui:define name="contenido">
        <h:form id="frmDescuento">
            <p:growl id="messages" showDetail="true" life="5000" />
            <p:panel header="Descuentos">
                <h:panelGroup rendered="#{dmodel.listado}" layout="block">
                    <p:toolbar id="barra" style="margin-bottom: 15px;">
                        <p:toolbarGroup>
                            <p:commandButton value="Nuevo Descuento" icon="pi pi-plus"
                                             action="#{dmodel.nuevo}" process="@this"
                                             update="@form" resetValues="true" styleClass="ui-button-success" />
                        </p:toolbarGroup>
                        <p:toolbarGroup align="right">
                            <h:outputText rendered="#{dmodel.seleccionado != null}"
                                          value="Seleccionado: #{dmodel.seleccionado.nombre}"
                                          style="margin-right: 15px; font-weight: 600;" />
                            <h:outputText rendered="#{dmodel.seleccionado == null}"
                                          value="Seleccione un descuento de la tabla para editarlo o eliminarlo"
                                          style="margin-right: 15px; color: #6b7280;" />
                            <p:commandButton value="Editar" icon="pi pi-pencil"
                                             action="#{dmodel.modificarSeleccionado}" process="@this"
                                             update="@form" resetValues="true"
                                             disabled="#{dmodel.seleccionado == null}"
                                             styleClass="ui-button-warning"
                                             style="margin-right: 8px;"/>
                            <p:commandButton value="Eliminar" icon="pi pi-trash"
                                             action="#{dmodel.eliminarSeleccionado}" process="@this"
                                             update="@form" disabled="#{dmodel.seleccionado == null}"
                                             styleClass="ui-button-danger">
                                <p:confirm header="Eliminar descuento"
                                           message="¿Desea eliminar el descuento seleccionado?"
                                           icon="pi pi-exclamation-triangle" />
                            </p:commandButton>
                        </p:toolbarGroup>
                    </p:toolbar>
                    <p:dataTable id="tablaDescuentos" value="#{dmodel.registrosLazy}"
                                 var="item" lazy="true" selectionMode="single"
                                 selection="#{dmodel.seleccionado}" rowKey="#{item.idDescuento}"
                                 paginator="true" rows="5"
                                 emptyMessage="Sin descuentos registrados.">
                        <p:ajax event="rowSelect" update=":frmDescuento:barra" />
                        <p:ajax event="rowUnselect" update=":frmDescuento:barra" />
                        <p:ajax event="page" listener="#{dmodel.cancelar}" update=":frmDescuento:barra" />
                        <p:column headerText="ID">
                            <h:outputText value="#{item.idDescuento}" />

                        </p:column>
                        <p:column headerText="Nombre">
                            <h:outputText value="#{item.nombre}" />
                        </p:column>
                        <p:column headerText="Tipo de descuento">
                            <h:outputText value="#{dmodel.nombreTipoDescuento(item.idTipoDescuento)}" />
                        </p:column>
                        <p:column headerText="Fecha de inicio">
                            <h:outputText value="#{item.fechaDesde}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Fecha final">
                            <h:outputText value="#{item.fechaHasta}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Observaciones">
                            <h:outputText value="#{item.observaciones}" />
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>
                <h:panelGroup id="formulario" rendered="#{dmodel.mostrarFormulario}" layout="block">
                    <h3><h:outputText value="#{dmodel.creando ? 'Crear descuento' : 'Modificar descuento'}" /></h3>
                    <p:panelGrid columns="2" layout="grid">
                        <p:outputLabel for="id" value="ID" />
                        <p:inputText id="id" value="#{dmodel.registro.idDescuento}" maxlength="300" required="false"
                                     disabled="true"/>
                        <p:outputLabel for="nombre" value="Nombre" />
                        <p:inputText id="nombre" value="#{dmodel.registro.nombre}" maxlength="155" required="true"
                                     requiredMessage="El nombre es obligatorio." />
                        <p:outputLabel for="tipoDescuento" value="Tipo de descuento" />
                        <p:selectOneMenu id="tipoDescuento" value="#{dmodel.idTipoDescuentoSeleccionado}"
                                         required="true" requiredMessage="Selecciona un tipo de descuento.">
                            <f:selectItem itemLabel="Seleccione un tipo" itemValue="" noSelectionOption="true" />
                            <f:selectItems value="#{dmodel.tiposDescuento}" var="tipo"
                                           itemLabel="#{tipo.nombre}" itemValue="#{tipo.idTipoDescuento.toString()}"
                                           itemDisabled="#{!tipo.activo and tipo.idTipoDescuento.toString() ne dmodel.idTipoDescuentoSeleccionado}" />
                        </p:selectOneMenu>
                        <p:outputLabel for="fechaDesde" value="Fecha de inicio" />
                        <p:datePicker id="fechaDesde" value="#{dmodel.registro.fechaDesde}"
                                      pattern="dd/MM/yyyy HH:mm" showTime="true" showIcon="true"
                                      timeZone="America/El_Salvador" required="true"
                                      requiredMessage="La fecha de inicio es obligatoria."/>
                        <p:outputLabel for="fechaHasta" value="Fecha final (opcional)" />
                        <p:datePicker id="fechaHasta" value="#{dmodel.registro.fechaHasta}"
                                      pattern="dd/MM/yyyy HH:mm" showTime="true" showIcon="true"
                                      timeZone="America/El_Salvador" />
                        <p:outputLabel for="observaciones" value="Observaciones" />
                        <p:inputTextarea id="observaciones" value="#{dmodel.registro.observaciones}" />
                    </p:panelGrid>
                    <p:commandButton value="Guardar" icon="pi pi-save" action="#{dmodel.guardar}"
                                     process="@form" update="@form" styleClass="ui-button-success" 
                                     style="margin-right: 8px;"/>
                    <p:commandButton value="Cancelar"
                                     actionListener="#{dmodel.cancelar()}"
                                     process="@this"
                                     update="@form"
                                     immediate="true"
                                     icon="pi pi-times"
                                     styleClass="ui-button-secondary" />
                </h:panelGroup>
            </p:panel>
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="Cancelar" type="button"
                                 styleClass="ui-confirmdialog-no ui-button-secondary" />
                <p:commandButton value="Eliminar" type="button" icon="pi pi-trash"
                                 styleClass="ui-confirmdialog-yes ui-button-danger" />
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
