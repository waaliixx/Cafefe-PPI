<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo_pagina">
        Roles
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmRol">
            <p:growl id="messages" showDetail="true" life="4000" />

            <p:panel header="Gestión de Roles del Sistema">

                <h:panelGroup rendered="#{!rolModel.mostrarFormulario}">

                    <p:toolbar id="barra" style="margin-bottom: 15px;">
                        <p:toolbarGroup>
                            <p:commandButton value="Nuevo Rol"
                                             actionListener="#{rolModel.nuevo()}"
                                             process="@this"
                                             update="@form"
                                             icon="pi pi-plus"
                                             styleClass="ui-button-success" />
                        </p:toolbarGroup>

                        <p:toolbarGroup align="right">
                            <h:outputText rendered="#{rolModel.seleccionado != null}"
                                          value="Seleccionado: #{rolModel.seleccionado.nombre}"
                                          style="margin-right: 15px; font-weight: 600;" />
                            <h:outputText rendered="#{rolModel.seleccionado == null}"
                                          value="Seleccione un rol de la tabla para editarlo o eliminarlo"
                                          style="margin-right: 15px; color: #6b7280;" />

                            <p:commandButton value="Editar"
                                             actionListener="#{rolModel.editar(rolModel.seleccionado)}"
                                             process="@this"
                                             update="@form"
                                             disabled="#{rolModel.seleccionado == null}"
                                             icon="pi pi-pencil"
                                             styleClass="ui-button-warning"
                                             style="margin-right: 8px;" />

                            <p:commandButton value="Eliminar"
                                             actionListener="#{rolModel.eliminar(rolModel.seleccionado)}"
                                             process="@this"
                                             update="@form"
                                             disabled="#{rolModel.seleccionado == null}"
                                             icon="pi pi-trash"
                                             styleClass="ui-button-danger">
                                <p:confirm header="Confirmación"
                                           message="¿Desea eliminar este rol?"
                                           icon="pi pi-exclamation-triangle" />
                            </p:commandButton>
                        </p:toolbarGroup>
                    </p:toolbar>

                    <p:dataTable id="tablaRoles" value="#{rolModel.registros}" var="item"
                                 selectionMode="single"
                                 selection="#{rolModel.seleccionado}"
                                 rowKey="#{item.idRol}"
                                 paginator="true" rows="10"
                                 emptyMessage="Sin registros previos.">

                        <p:ajax event="rowSelect" update=":frmRol:barra" />
                        <p:ajax event="rowUnselect" update=":frmRol:barra" />

                        <p:column headerText="ID Rol" style="width: 280px;">
                            <h:outputText value="#{item.idRol}" />
                        </p:column>

                        <p:column headerText="Nombre">
                            <h:outputText value="#{item.nombre}" />
                        </p:column>

                        <p:column headerText="Estado" style="text-align: center; width: 100px;">
                            <p:tag value="#{item.activo ? 'ACTIVO' : 'INACTIVO'}"
                                   severity="#{item.activo ? 'success' : 'danger'}" />
                        </p:column>

                        <p:column headerText="Observaciones">
                            <h:outputText value="#{item.observaciones}" />
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>

                <p:panel header="#{rolModel.creando ? 'Nuevo Rol' : 'Editar Rol'}"
                         rendered="#{rolModel.mostrarFormulario}">

                    <p:panelGrid columns="2" styleClass="ui-panelgrid-blank">
                        <p:outputLabel for="nombre" value="Nombre del Rol:" />
                        <p:inputText id="nombre" value="#{rolModel.registro.nombre}"
                                     required="true"
                                     requiredMessage="El nombre del rol es obligatorio"
                                     placeholder="Ej: cajero, camarero, barista" />

                        <p:outputLabel for="activo" value="Activo:" />
                        <p:selectBooleanCheckbox id="activo" value="#{rolModel.registro.activo}" />

                        <p:outputLabel for="observaciones" value="Observaciones:" />
                        <p:inputTextarea id="observaciones" value="#{rolModel.registro.observaciones}"
                                         rows="3" cols="30" />
                    </p:panelGrid>

                    <div style="margin-top: 15px;">
                        <p:commandButton value="Guardar"
                                         actionListener="#{rolModel.guardar()}"
                                         process="@form"
                                         update="@form"
                                         icon="pi pi-check"
                                         style="margin-right: 10px;" />
                        <p:commandButton value="Cancelar"
                                         actionListener="#{rolModel.cancelar()}"
                                         process="@this"
                                         update="@form"
                                         immediate="true"
                                         icon="pi pi-times"
                                         styleClass="ui-button-secondary" />
                    </div>
                </p:panel>
            </p:panel>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade"
                             responsive="true" width="350">
                <p:commandButton value="No" type="button"
                                 styleClass="ui-confirmdialog-no ui-button-flat" />
                <p:commandButton value="Sí" type="button"
                                 styleClass="ui-confirmdialog-yes" />
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
